<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Periscope">
  <defs>
    <clipPath id="pBadge"><circle cx="64" cy="64" r="60"/></clipPath>
    <clipPath id="pBelow"><rect x="0" y="80" width="128" height="48"/></clipPath>

    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF0"/>
      <stop offset="1" stop-color="#FFF3C4"/>
    </linearGradient>
    <linearGradient id="pWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BC8F0" stop-opacity=".62"/>
      <stop offset=".5" stop-color="#2E9BD6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#0E5FA8" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="pLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FD3FF"/>
      <stop offset=".55" stop-color="#1D6FD1"/>
      <stop offset="1" stop-color="#0A2A66"/>
    </linearGradient>
    <linearGradient id="pHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE94A"/>
      <stop offset=".6" stop-color="#FFC400"/>
      <stop offset="1" stop-color="#C98F00"/>
    </linearGradient>
    <radialGradient id="pBubble" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#bfe8ff" stop-opacity=".15"/>
    </radialGradient>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#pSky)"/>

