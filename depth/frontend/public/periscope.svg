  <circle cx="64" cy="64" r="59" fill="none" stroke="#E0A800" stroke-width="2.4"/>
  <circle cx="64" cy="64" r="60.6" fill="none" stroke="#6B4A00" stroke-opacity=".25" stroke-width=".8"/>
